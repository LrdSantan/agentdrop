<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#333;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Front face -->
  <polygon points="30,50 30,80 70,80 70,50" fill="#000" stroke="#fff" stroke-width="1.5"/>
  
  <!-- Top face -->
  <polygon points="30,50 50,30 70,50 50,35" fill="#1a1a1a" stroke="#fff" stroke-width="1.5"/>
  
  <!-- Right face -->
  <polygon points="70,50 50,35 50,65 70,80" fill="#2a2a2a" stroke="#fff" stroke-width="1.5"/>
  
  <!-- Highlight -->
  <circle cx="50" cy="50" r="8" fill="none" stroke="#fff" stroke-width="1" opacity="0.6"/>
</svg>